<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent}
body{font:bold 20px Georgia,"Times New Roman",serif;color:#3aa76d;white-space:nowrap;overflow:hidden}
</style></head><body><span id="v">&hellip;</span>
<script>
var KEY="discShared",S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
document.getElementById("v").textContent = S ? S.xs.join(", ") : "?";
setTimeout(function(){
  try{ if(S){ S.used=true; localStorage.setItem(KEY,JSON.stringify(S)); } }catch(e){}
}, 800);
</script></body></html>
